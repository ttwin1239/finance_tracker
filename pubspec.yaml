name: test_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  intl: ^0.20.3
  crypto: ^3.0.3
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_launcher_icons: ^0.14.1
  provider: ^6.1.2
  logger: ^2.4.0
  flutter_local_notifications: ^19.0.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2AABEE"
  adaptive_icon_foreground: "assets/icon.png"